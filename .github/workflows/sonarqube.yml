
name: Go - Testes e SonarQube

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  analisar:
    name: Testes Go e análise SonarQube
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Executar testes e gerar cobertura
        shell: cmd
        run: go test -count=1 ./... -coverprofile=coverage.out

      - name: Verificar configuração SonarQube
        shell: cmd
        run: |
          echo === Diretorio de trabalho ===
          cd
          echo === Conteudo do arquivo ===
          type sonar-project.properties
          echo === Propriedade projectKey ===
          findstr /n /i "sonar.projectKey" sonar-project.properties

      - name: Analisar com SonarScanner
        shell: cmd
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://localhost:9000
        run: '"C:\Ferramentas\sonar-scanner\bin\sonar-scanner.bat" "-Dsonar.host.url=%SONAR_HOST_URL%" "-Dsonar.token=%SONAR_TOKEN%"'
