
name: Go - Testes e SonarQube

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  analisar:
    name: Testes Go e análise SonarQube
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Executar testes e gerar cobertura
        shell: powershell
        run: |
          go test -count=1 ./... -coverprofile=coverage.out
          if ($LASTEXITCODE -ne 0) {
            throw "Os testes Go falharam."
          }

      - name: Analisar com SonarScanner
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://localhost:9000
        run: |
          & "C:\Ferramentas\sonar-scanner\bin\sonar-scanner.bat" `
            "-Dsonar.host.url=$env:SONAR_HOST_URL" `
            "-Dsonar.token=$env:SONAR_TOKEN"

          if ($LASTEXITCODE -ne 0) {
            throw "A análise do SonarScanner falhou."
          }
